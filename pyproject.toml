[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sonar"
version = "0.1.0"
description = "Local-first household finance dashboard: bank imports, categorization, recurring payments and a cash-flow forecast to payday"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "httpx",
    "pytailwindcss",
    "beautifulsoup4",
]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "UP", "B"]

[project.scripts]
sonar = "sonar.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
